<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Hoboken al geboren?</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Outfit', sans-serif;
    background: radial-gradient(circle at top left, #1e3c72, #0f2027 60%);
    overflow: hidden;
    color: white;
}

/* Animated background glow */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,0,100,0.4), transparent 70%);
    top: -200px;
    right: -200px;
    animation: float 6s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(0px); }
    to { transform: translateY(40px); }
}

.container {
    text-align: center;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    padding: 80px;
    border-radius: 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    animation: fadeIn 1.5s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 4rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 30px;
}

.answer {
    font-size: 6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* Subtle floating particles */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.3;
    animation: rise 10s linear infinite;
}

@keyframes rise {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    20% { opacity: 0.5; }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Is Hoboken al geboren?</h1>
    <div class="answer">Nee</div>
</div>

<script>
// Create floating particles
for (let i = 0; i < 25; i++) {
    const particle = document.createElement("div");
    particle.classList.add("particle");
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDuration = (5 + Math.random() * 10) + "s";
    particle.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(particle);
}
</script>

</body>
</html>
