<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Hoboken al geboren?</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #ffd6e0, #d6f0ff, #fff5c3);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    overflow: hidden;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.8);
    padding: 60px 80px;
    border-radius: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 3.5rem;
    color: #ff8fab;
    margin-bottom: 20px;
}

.answer {
    font-size: 6rem;
    font-weight: 700;
    color: #4dabf7;
    animation: bounce 1.5s infinite;
}

.dilation {
    font-size: 2.5rem;
    font-weight: 600;
    color: #ff8fab;
    margin-top: 20px;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Balloons */
.balloon {
    position: absolute;
    bottom: -150px;
    width: 60px;
    height: 80px;
    border-radius: 50%;
    animation: floatUp 12s linear infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 60px;
    background: #999;
    top: 80px;
    left: 50%;
}

@keyframes floatUp {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-120vh);
    }
}

/* Clouds */
.cloud {
    position: absolute;
    background: white;
    width: 120px;
    height: 60px;
    border-radius: 50px;
    opacity: 0.8;
    animation: drift 30s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    top: -40px;
}

.cloud::before { left: 10px; }
.cloud::after { right: 10px; }

@keyframes drift {
    from { transform: translateX(-200px); }
    to { transform: translateX(120vw); }
}
</style>
</head>

<body>

<div class="container">
    <h1>👶 Is Hoboken al geboren?</h1>
    <div class="answer">Nee 💕</div>
    <div class="dilation">Ontsluiting: 3 cm 💪</div>
</div>

<script>
// Balloons
const colors = ["#ff8fab", "#ffd166", "#a0c4ff", "#caffbf", "#bdb2ff"];

for (let i = 0; i < 10; i++) {
    const balloon = document.createElement("div");
    balloon.classList.add("balloon");
    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
    balloon.style.animationDuration = (8 + Math.random() * 6) + "s";
    balloon.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(balloon);
}

// Clouds
for (let i = 0; i < 3; i++) {
    const cloud = document.createElement("div");
    cloud.classList.add("cloud");
    cloud.style.top = (10 + i * 20) + "vh";
    cloud.style.animationDuration = (40 + i * 10) + "s";
    document.body.appendChild(cloud);
}
</script>

</body>
</html>
